<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc"><title id="title">How it works</title><desc id="desc">Judge scores for all responses and a probability sample of human ratings enter llmaudit, which reports a human-reference difference and confidence interval.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="640" height="520" rx="16" fill="#f8fafc"/><rect x="30" y="30" width="270" height="100" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="165.0" y="73.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Judge scores</text><text x="165.0" y="101.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Every response</text><rect x="340" y="30" width="270" height="100" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="475.0" y="73.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Human ratings</text><text x="475.0" y="101.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Probability sample</text><path d="M165,130 L165,160 L320,160 L320,195" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M475,130 L475,160 L320,160" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="100" y="200" width="440" height="100" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="320.0" y="243.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">llmaudit</text><text x="320.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Correct the comparison</text><path d="M320,300 L320,355" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="100" y="360" width="440" height="110" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="320.0" y="408.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Human-reference difference</text><text x="320.0" y="436.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">+ confidence interval</text></svg>
